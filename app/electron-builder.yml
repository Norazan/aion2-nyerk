# Native Linux desktop distribution. Windows NSIS is retained via npm run dist:win on Windows.
#
#   npm run dist      -> dist/Nyerk-<version>-<arch>.AppImage
#   npm run pack      -> dist/linux-unpacked/
#
# The tracker helper is the PyInstaller build in ../build/sidecar/aion2-tracker (npm run dist builds
# it first: scripts/build-sidecar.mjs). Build on the target OS. Linux requires the system libpcap;
# Windows requires Npcap. Live capture permissions are configured separately for the helper.
# appId, executableName and the package name (the install folder) are kept from the first release:
# the updater and the installed copy are found by them. The product name was renamed in 0.1.11.
appId: com.xcrov.aion2-drop-tracker
productName: Nyerk
executableName: Aion2DropTracker
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../build/sidecar/aion2-tracker
    to: sidecar
    filter: ['**/*']
asar: true
electronLanguages: [en-US]
# Let electron-builder download/cache the locked Electron version. Recent Electron npm
# packages install their development binary lazily, so node_modules/electron/dist may be absent.
linux:
  target: [AppImage]
  category: Game
  icon: build/icon.png
  artifactName: Nyerk-${version}-${arch}.${ext}
  syncDesktopName: true
win:
  target: [nsis]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  shortcutName: Nyerk
  artifactName: Nyerk-Setup-${version}.${ext}
# The update feed. electron-builder bakes this into the build as app-update.yml; `npm run dist`
# publishes nothing itself (--publish never).
publish:
  provider: generic
  url: https://nyerk.app/updates/
  channel: latest
